name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! 🚀 Please provide as much detail as possible.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area would this feature enhance?
      options:
        - Firefox Extension UI
        - Error Detection & Analysis
        - MCP Server Integration
        - Installation & Setup
        - Documentation
        - Performance & Optimization
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's missing currently?
      placeholder: "As a developer using Claude Console Debugger, I find that..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: "I would like to be able to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative solutions or workarounds?

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Essential for my use case
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case & Examples
      description: Provide specific examples of when and how this feature would be used
      placeholder: "For example, when debugging a React app, I would..."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this feature hasn't been requested
          required: true
        - label: I have provided a clear problem statement and proposed solution
          required: true
        - label: This feature would benefit other users, not just my specific use case
          required: true
