version: '3.8'

services:
  claude-debugger:
    build: .
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - PORT=8081
      - LOG_LEVEL=debug
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

